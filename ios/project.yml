name: Documents

options:
  createIntermediateGroups: true
  bundleIdPrefix: com.docdeck
  developmentRegion: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: P6N9Y58QYJ
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
  NativeArchives:
    path: Packages/NativeArchives

targets:
  Documents:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Documents
    dependencies:
      - package: ZIPFoundation
      - package: NativeArchives
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.docdeck.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Documents
        INFOPLIST_KEY_NSCameraUsageDescription: Documents uses the camera to scan documents, ID cards, and test papers.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Documents uses Face ID to unlock your encrypted Private Safe copies.
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_TESTABILITY: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  DocumentsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: DocumentsTests
    resources:
      - path: DocumentsTests/Fixtures
    dependencies:
      - target: Documents
      - package: ZIPFoundation
      - package: NativeArchives
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.docdeck.app.tests
        GENERATE_INFOPLIST_FILE: YES

  DocumentsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: DocumentsUITests
    dependencies:
      - target: Documents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.docdeck.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Documents

schemes:
  Documents:
    build:
      targets:
        Documents: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DocumentsTests
        - DocumentsUITests
    profile:
      config: Release
    analyze:
      config: Debug
